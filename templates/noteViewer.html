<!-- File viewer -->

<header>
  <nav>
    <menu>
      <button class='addRemove' id='addFile' title='Create a new file'></button>
      <button class='addRemove' id='removeFile' title='Delete selected file'></button>
      <button class='addRemove' id='saveFile' title='Save file'></button>
      <button class='addRemove' id='refreshButton' title='Refresh'></button>
      <button class='addRemove' id='changeBaseDir' title='Change directory'></button>
    </menu>
    <h1>txt-notes</h1>
    <span id='searchBox'><input type='search' id='search' placeholder='Search'></span>
  </nav>
</header>
<section id='grid'>
  <section id='txtFileList' class='split split-horizontal'>
    <ul id='fileNames'>
      <include src='noteList'></include>
    </ul>
  </section>
  <div class='gutter'></div>
  <section id='txtFileView' class='split split-horizontal'>
    <p id='lastModified'></p>
    <div id='editor'>
      <!-- copy of the note's text behind the editor, used to highlight find matches -->
      <div id='findHighlights' aria-hidden='true' hidden></div>
      <textarea id='fileEditor'></textarea>
    </div>
    <div id='findBar' hidden>
      <input type='text' id='findInput' placeholder='Find' aria-label='Find in note'>
      <span id='findCount'></span>
      <button id='findPrevious' title='Previous match'></button>
      <button id='findNext' title='Next match'></button>
      <button id='findClose' title='Close'></button>
    </div>
  </section>
  <section id='printArea'></section>
</section>
